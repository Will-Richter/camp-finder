name: Import towns (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge towns into the camp data
        run: |
          K=sb_publishable_VIMVz7yyvc5-GR_v1aQmwg_oBtMIju0
          curl -sf "https://cesprkqwzmcioeydxsms.supabase.co/rest/v1/town_import?select=data&id=eq.1" -H "apikey: $K" -H "Authorization: Bearer $K" > towns.json
          python3 - <<'PY'
          import json
          rows = json.load(open("towns.json"))[0]["data"]
          assert len(rows) > 3000, len(rows)
          for path in ("docs/data/camps-au.json", "ios-native/CampFinder/web/data/camps-au.json"):
              d = json.load(open(path))
              d["towns"] = [[float(r[0]), float(r[1]), str(r[2])[:40], int(r[3])] for r in rows]
              json.dump(d, open(path, "w"), ensure_ascii=False, separators=(",", ":"))
              print(path, len(d["towns"]), "towns")
          PY
          rm towns.json
          git config user.name "camp-data-bot"
          git config user.email "camp-data-bot@users.noreply.github.com"
          git add docs/data/camps-au.json ios-native/CampFinder/web/data/camps-au.json
          git commit -m "Towns for all of Australia" && git push
