name: Vendor offline map renderer

on:
  workflow_dispatch:
  push:
    paths: ["tools/vendor.trigger"]

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download protomaps-leaflet
        run: |
          set -e
          mkdir -p /tmp/v && cd /tmp/v
          V=$(npm view protomaps-leaflet version); echo "protomaps-leaflet $V"
          npm pack protomaps-leaflet@$V
          tar -xzf protomaps-leaflet-$V.tgz
          ls package/dist
          F=$(ls package/dist/*.js | grep -E 'protomaps-leaflet(\.min)?\.js$' | head -1); [ -z "$F" ] && F=$(ls package/dist/*.js | head -1)
          echo "using $F"
          cd "$GITHUB_WORKSPACE"
          for d in docs/vendor ios-native/CampFinder/web/vendor; do cp "/tmp/v/$F" "$d/protomaps-leaflet.js"; done
          echo "$V" > docs/vendor/protomaps-leaflet.version
          head -c 400 docs/vendor/protomaps-leaflet.js
      - name: Commit
        run: |
          git config user.name "camp-data-bot"
          git config user.email "camp-data-bot@users.noreply.github.com"
          git add docs/vendor ios-native/CampFinder/web/vendor
          git diff --cached --quiet || git commit -m "Vendor protomaps-leaflet (offline maps)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
