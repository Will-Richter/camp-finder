name: 4WD tracks

# Every off-road track in Australia from OpenStreetMap (highway=track, 4wd_only, sand/beach driving),
# packed into one vector tile file the app draws as its 4WD map.
on:
  workflow_dispatch:
  push:
    paths: ["tools/tracks.trigger"]

permissions:
  contents: write

jobs:
  tracks:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool build-essential libsqlite3-dev zlib1g-dev >/dev/null
          git clone -q --depth 1 https://github.com/felt/tippecanoe.git /tmp/tc && make -s -C /tmp/tc -j4 >/dev/null && sudo make -s -C /tmp/tc install >/dev/null
          tippecanoe --version
      - name: Download Australia
        run: curl -sSL -o /tmp/au.pbf https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf && ls -la /tmp/au.pbf
      - name: Extract tracks
        run: |
          set -e
          # tracks, 4WD-only and sand/beach driving, rough roads, roads named like tracks, vehicle beaches
          osmium tags-filter /tmp/au.pbf w/highway=track w/4wd_only w/surface=sand,beach w/smoothness=very_bad,horrible,very_horrible,impassable \
            w/tracktype w/highway=unclassified,tertiary,secondary,service,road w/motor_vehicle=yes,designated,permissive w/vehicle=yes,designated,permissive \
            a/natural=beach -o /tmp/t1.pbf --overwrite
          osmium export /tmp/t1.pbf -f geojsonseq -o /tmp/t.geojsonseq --overwrite -c tools/osmium-export.json
          wc -l /tmp/t.geojsonseq
          python3 tools/tracks_clean.py /tmp/t.geojsonseq /tmp/tracks.geojsonseq
      - name: What's around each camp (beach, river, lake, dam, rock, waterfall)
        run: |
          set -e
          osmium tags-filter /tmp/au.pbf nwr/natural=beach,coastline,water,cliff,bare_rock,rock,stone,scree,valley,waterfall \
            nw/waterway=waterfall w/waterway=river,stream,canal,dam,weir nwr/landuse=reservoir -o /tmp/f.pbf --overwrite
          osmium export /tmp/f.pbf -f geojsonseq -o /tmp/f.geojsonseq --overwrite -c tools/osmium-features.json
          wc -l /tmp/f.geojsonseq
          python3 tools/camp_features.py /tmp/f.geojsonseq docs/data/camp-features.json
      - name: Tiles
        run: |
          set -e
          mkdir -p docs/tiles
          tippecanoe -o /tmp/tracks.pmtiles -Z5 -z12 --force \
            -j '{"tracks":["any",[">=","$zoom",10],["has","n"],["==","g",5],["==","w",1],["==","s",1]]}' \
            --drop-smallest-as-needed --simplification=4 \
            -L tracks:/tmp/tracks.geojsonseq
          ls -la /tmp/tracks.pmtiles
          S=$(stat -c %s /tmp/tracks.pmtiles); echo "size $S"
          if [ "$S" -lt 95000000 ]; then cp /tmp/tracks.pmtiles docs/tiles/tracks.pmtiles; echo "{\"bytes\": $S, \"built\": \"$(date -u +%FT%TZ)\"}" > docs/tiles/tracks.json; else echo "TOO BIG for Pages"; echo "{\"bytes\": $S, \"tooBig\": true}" > docs/tiles/tracks.json; fi
      - name: Commit
        run: |
          git config user.name "camp-data-bot"
          git config user.email "camp-data-bot@users.noreply.github.com"
          git add docs/tiles docs/data/camp-features.json
          git diff --cached --quiet || git commit -m "4WD tracks and camp surroundings from OpenStreetMap"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
