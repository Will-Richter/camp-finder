name: Update camp database

on:
  schedule:
    - cron: "17 16 * * 0"   # every Monday ~2am Brisbane time
  push:
    paths: ["tools/camps.trigger"]
  workflow_dispatch:
    inputs:
      extras_only:
        description: "Only refresh towns, fuel stations and water points (quick)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Australia from OpenStreetMap (Geofabrik extract, so busy Overpass servers can't stop the update)
        if: ${{ !inputs.extras_only }}
        continue-on-error: true
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null
          curl -sSL --retry 3 -o /tmp/au.pbf https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf && ls -la /tmp/au.pbf
          osmium tags-filter /tmp/au.pbf nwr/tourism=camp_site,caravan_site nwr/leisure=slipway \
            nwr/amenity=sanitary_dump_station,fuel,water_point,drinking_water n/place=city,town,village nw/maxheight -o /tmp/camps.pbf --overwrite
          osmium export /tmp/camps.pbf -f geojsonseq -c tools/osmium-camps.json -o /tmp/camps.geojsonseq --overwrite
          wc -l /tmp/camps.geojsonseq
      - name: Build the camp database
        run: python3 -u tools/build_camp_data.py --geojsonseq=/tmp/camps.geojsonseq ${{ inputs.extras_only && '--extras-only' || '' }} 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Commit if changed
        run: |
          git config user.name "camp-data-bot"
          git config user.email "camp-data-bot@users.noreply.github.com"
          cp docs/data/camps-au.json ios-native/CampFinder/web/data/camps-au.json
          git add docs/data/camps-au.json ios-native/CampFinder/web/data/camps-au.json
          git diff --cached --quiet || git commit -m "Weekly camp database update"
          # the app may have changed while this ran (it takes hours): put the update on top of the latest code
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
      - name: Keep the build log
        if: always()
        run: |
          git config user.name "camp-data-bot"
          git config user.email "camp-data-bot@users.noreply.github.com"
          git fetch origin build-log || true
          git checkout --orphan build-log-new
          git rm -rf --cached . > /dev/null
          git add -f build.log
          git commit -m "Build log $(date -u +%FT%TZ)"
          git push -f origin build-log-new:build-log
